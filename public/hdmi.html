<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>EdgeController HDMI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#06080f;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
#grid{display:grid;width:100vw;height:100vh;gap:10px;padding:10px}
.w{background:#0d1120;border:0.5px solid #1a2235;border-radius:8px;padding:10px;display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0}
.w-title{font-size:12px;color:#5a6a8a;font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.w-badge{font-size:10px;color:#3a7fff;background:#0d2040;border-radius:3px;padding:1px 5px;flex-shrink:0;margin-left:6px}
.w-idle .w-badge{color:#2a3555;background:#0a0f1a}
.wfc{flex:1;min-height:0;width:100%;display:block;border-radius:3px}
.dials{display:flex;justify-content:space-around;margin-top:6px;gap:4px;flex-shrink:0}
.dial-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.w-cam-inner{flex:1;background:#06080f;border-radius:4px;display:flex;align-items:center;justify-content:center;border:0.5px solid #131925;min-height:0}
.w-cam-label{font-size:10px;color:#1e2a40;margin-top:3px;letter-spacing:.05em}
.w-center{align-items:center;justify-content:center;gap:6px}
.no-layout{display:flex;align-items:center;justify-content:center;height:100vh;color:#2a3555;font-size:16px;letter-spacing:.1em}
video{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block}
</style>
</head>
<body>
<div id="root"></div>
<script>
const WS_URL = location.origin.replace(/^http/,'ws')
let S = { devices:{}, groups:[], waveforms:{ builtin:[], custom:[], live:[] }, macros:[], macroLiveState:{} }
let _ws
let _cams = {}
const _liveSpectra = {}

let _wsEverConnected = false
function connect() {
  _ws = new WebSocket(WS_URL)
  _ws.onopen = () => {
    if (_wsEverConnected) { location.reload(); return }
    _wsEverConnected = true
  }
  _ws.onmessage = e => { try { handle(JSON.parse(e.data)) } catch {} }
  _ws.onclose = () => setTimeout(connect, 2000)
}

function handle(m) {
  if (m.type === 'state') {
    S.waveforms = m.waveforms
    S.groups = m.groups || []
    S.macroLiveState = m.macroLiveState || {}
    S.macros = m.macros || []
    S.devices = {}
    for (const d of m.devices) { d.tickAt = performance.now(); S.devices[d.id] = d }
    renderHdmi()
  }
  if (m.type === 'macro:added')   { S.macros.push(m.macro) }
  if (m.type === 'macro:updated') { const i = S.macros.findIndex(x => x.id === m.macro.id); if (i !== -1) S.macros[i] = m.macro; document.querySelectorAll(`[data-macro-id="${m.macro.id}"]`).forEach(el => el._macroSync?.()) }
  if (m.type === 'macro:removed') { S.macros = S.macros.filter(x => x.id !== m.id) }
  if (m.type?.startsWith('macro:') && m.type !== 'macro:added' && m.type !== 'macro:updated' && m.type !== 'macro:removed') {
    updateMacroLiveStateClient(m)
    document.querySelectorAll(`[data-macro-id="${m.id}"]`).forEach(el => el._macroSync?.())
  }
  if (m.type === 'device:state') {
    if (S.devices[m.id]) { Object.assign(S.devices[m.id], m); S.devices[m.id].tickAt = performance.now() }
    updateLiveWidgets(m.id)
  }
  if (m.type === 'device:tick') {
    if (S.devices[m.id]) { S.devices[m.id].ticks = m.ticks; S.devices[m.id].paused = m.paused; S.devices[m.id].tickAt = performance.now() }
  }
  if (m.type === 'device:added')   { m.device.tickAt = performance.now(); S.devices[m.device.id] = m.device; renderHdmi() }
  if (m.type === 'device:removed') { delete S.devices[m.id]; renderHdmi() }
  if (m.type === 'device:updated') { S.devices[m.device.id] = m.device; renderHdmi() }
  if (m.type === 'hdmi:updated')   { Object.assign(S.devices[m.device.id] || {}, m.device); S.devices[m.device.id] = m.device; renderHdmi() }
  if (m.type === 'hdmi:reload')    { location.reload() }
  if (m.type === 'media:updated')  { S.devices[m.device.id] = m.device; renderHdmi() }
  if (m.type === 'media:state') {
    if (S.devices[m.id]) S.devices[m.id].playback = m.playback
    document.querySelectorAll(`[data-media-dev-id="${m.id}"]`).forEach(el => el._mediaSync?.())
  }
  if (m.type === 'live:audio:level') {
    if (!_liveSpectra[m.id]) _liveSpectra[m.id] = { levelBuf: [] }
    const sp = _liveSpectra[m.id]
    sp.levelBuf.push(m.level || 0)
    if (sp.levelBuf.length > 300) sp.levelBuf.shift()
  }
  if (m.type === 'live:audio:updated') { if (m.inputs) S.waveforms.live = m.inputs }
  if (m.type === 'waveforms:updated') { if (m.waveforms) S.waveforms = { ...m.waveforms, live: S.waveforms.live || [] } }
  if (m.type === 'group:updated' || m.type === 'group:added' || m.type === 'group:removed' || m.type === 'groups:reordered') {
    if (m.type === 'group:updated') { const i = S.groups.findIndex(g=>g.id===m.group.id); if(i>=0) S.groups[i]=m.group; else S.groups.push(m.group) }
    if (m.type === 'group:added')   S.groups.push(m.group)
    if (m.type === 'group:removed') S.groups = S.groups.filter(g=>g.id!==m.id)
    if (m.type === 'groups:reordered') S.groups = m.groups
    renderHdmi()
  }
}

// ── Rendering ─────────────────────────────────────────────────────────────────

function hdmiDevice() {
  return Object.values(S.devices).find(d => d.type === 'hdmi')
}

function activeLayout(dev) {
  return dev?.layouts?.find(l => l.id === dev.activeLayout) || dev?.layouts?.[0]
}

function parseGrid(g) {
  const [cols, rows] = (g || '4x2').split('x').map(Number)
  return { cols: cols || 4, rows: rows || 2 }
}

function renderHdmi() {
  const root = document.getElementById('root')
  const dev = hdmiDevice()
  const layout = activeLayout(dev)

  if (!layout) {
    root.innerHTML = '<div class="no-layout">No layout configured</div>'
    return
  }

  const { cols, rows } = parseGrid(layout.grid)
  root.innerHTML = `<div id="grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr));grid-template-rows:repeat(${rows},minmax(0,1fr));gap:10px;padding:10px;display:grid;width:100vw;height:100vh;"></div>`
  const grid = document.getElementById('grid')

  if (!layout.widgets || !layout.widgets.length) {
    for (let i = 0; i < cols * rows; i++) {
      const ph = document.createElement('div')
      ph.className = 'w w-center'
      ph.style.cssText = 'border:1px dashed #1a2235;background:transparent'
      grid.appendChild(ph)
    }
    return
  }

  for (const w of layout.widgets) {
    const el = buildWidget(w)
    el.style.gridColumn = `${w.col + 1} / span ${w.colSpan || 1}`
    el.style.gridRow    = `${w.row + 1} / span ${w.rowSpan || 1}`
    grid.appendChild(el)
  }

  // Start waveform viz loops
  for (const w of layout.widgets) {
    if (w.type === 'channel') {
      const cv = document.getElementById('wfc-' + w.deviceId + '-' + w.channel)
      if (cv) startChWfViz(cv, w.deviceId, w.channel)
    }
    if (w.type === 'group') {
      const cv = document.getElementById('wfc-grp-' + w.groupId)
      if (cv) startGrpWfViz(cv, w.groupId)
    }
  }

  // Start cameras
  for (const w of layout.widgets) {
    if (w.type === 'camera') {
      const camDev = S.devices[w.deviceId]
      if (camDev?.streamKey) startCam(w.id, camDev.streamKey)
    }
  }
}

function buildWidget(w) {
  if (w.type === 'channel') return buildChannelWidget(w)
  if (w.type === 'group')   return buildGroupWidget(w)
  if (w.type === 'camera')  return buildCameraWidget(w)
  if (w.type === 'clock')   return buildClockWidget(w)
  if (w.type === 'video')   return buildVideoWidget(w)
  if (w.type === 'text')    return buildTextWidget(w)
  if (w.type === 'bodymap') return buildBodyMapWidget(w)
  if (w.type === 'media')   return buildMediaWidget(w)
  if (w.type === 'macro')   return buildMacroWidget(w)
  const el = document.createElement('div')
  el.className = 'w'
  return el
}

function buildTextWidget(w) {
  const el = document.createElement('div')
  el.className = 'w'
  el.style.cssText = 'display:flex;align-items:center;justify-content:center'
  const t = document.createElement('div')
  t.style.cssText = 'color:#d0d8f0;font-weight:400;text-align:center;white-space:pre-wrap;word-break:break-word;width:100%;max-width:100%'
  el.appendChild(t)

  // Scale font size to the widget's actual box (not viewport width) — binary
  // search the largest size that still fits, re-run whenever the box resizes
  // (grid size change, layout switch, window resize).
  function fit() {
    const hasText = !!(w.text||'').trim()
    t.textContent = hasText ? w.text : '(no text)'
    t.style.color = hasText ? '#d0d8f0' : '#2a3555'
    let lo = 8, hi = 200, best = lo
    while (lo <= hi) {
      const mid = (lo + hi) >> 1
      t.style.fontSize = mid + 'px'
      if (t.scrollHeight <= el.clientHeight && t.scrollWidth <= el.clientWidth) { best = mid; lo = mid + 1 }
      else hi = mid - 1
    }
    t.style.fontSize = best + 'px'
  }
  new ResizeObserver(fit).observe(el)
  return el
}

function buildChannelWidget(w) {
  const dev = S.devices[w.deviceId]
  const ch  = dev?.channels?.[w.channel] || {}
  const active = (ch.intensity || 0) > 0
  const wfName = resolveWfName(ch.waveform)
  const el = document.createElement('div')
  el.className = 'w' + (active ? '' : ' w-idle')
  el.dataset.widgetId = w.id
  el.innerHTML = `
    <div style="display:flex;align-items:center;margin-bottom:5px;flex-shrink:0">
      <span class="w-title">${dev?.name || 'Unknown'} · ${w.channel}</span>
      <span class="w-badge">${wfName}</span>
    </div>
    <canvas class="wfc" id="wfc-${w.deviceId}-${w.channel}"></canvas>
    <div class="dials">
      <canvas class="dc" width="64" height="64" data-v="${Math.round(ch.intensity||0)}" data-max="200" data-color="#4da6ff" data-label="INT"></canvas>
      <canvas class="dc" width="64" height="64" data-v="${Math.round(ch.baseFreq||0)}" data-max="100" data-color="#ffc832" data-label="HZ"></canvas>
      <canvas class="dc" width="64" height="64" data-v="${Math.round((ch.intensity||0)/2)}" data-max="100" data-color="#32e88c" data-label="SPD"></canvas>
    </div>`
  setTimeout(() => el.querySelectorAll('.dc').forEach(c => drawDial(c)), 0)
  return el
}

function grpChannelState(grp) {
  for (const { deviceId, channel } of grp.channels || []) {
    const ch = S.devices[deviceId]?.channels?.[channel]
    if (ch) return ch
  }
  return {}
}

// ── Body map (read-only mirror of the Coyote tab's body map) ────────────────
const _BM_COLORS = ['#a78bfa','#f472b6','#4ade80','#fb923c','#38bdf8','#fbbf24','#e879f9','#34d399']
function _bmColor(groupId) {
  const idx = (S.groups||[]).findIndex(g=>g.id===groupId)
  return _BM_COLORS[Math.max(0,idx) % _BM_COLORS.length]
}
const _BODY_SVG = `<svg viewBox="0 0 60 150" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:100%">
  <ellipse cx="30" cy="9" rx="9" ry="9.5" stroke="#aaaaaa" stroke-width="1.2"/>
  <path d="M26,18 C20,22 10,28 6,40 L4,70 C3,74 3,79 6,81 L13,81 L15,56 L18,43
           L18,90 L16,98 L16,148 L25,148 L25,110 C27,106 33,106 35,110
           L35,148 L44,148 L44,98 L42,90 L42,43 L45,56 L47,81 L54,81
           C57,79 57,74 56,70 L54,40 C50,28 40,22 34,18 Z"
    stroke="#aaaaaa" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
</svg>`

function buildBodyMapWidget(w) {
  const el = document.createElement('div')
  el.className = 'w'
  el.style.cssText = 'display:flex;flex-direction:row;align-items:center;justify-content:center;gap:16px'
  el.dataset.widgetId = w.id

  const front = document.createElement('div')
  const back  = document.createElement('div')
  // Pure-CSS fit: height:100% of the flex box, aspect-ratio derives width,
  // max-width clamps (and the ratio then re-derives a smaller height) so
  // both panels always fit side by side — no JS measurement/race needed.
  front.style.cssText = back.style.cssText = 'position:relative;height:100%;max-height:100%;aspect-ratio:2/5;max-width:45%'
  el.appendChild(front); el.appendChild(back)

  function renderSide(container, side) {
    container.innerHTML = _BODY_SVG
    for (const g of S.groups || []) {
      if (g.bodyPos?.side !== side) continue
      const x = g.bodyPos.x * 100, y = g.bodyPos.y * 100
      const col = _bmColor(g.id)
      const pct = grpChannelState(g).intensity || 0
      const deg = pct * 3.6
      const initials = (g.name||'?').split(' ').map(s=>s[0]).join('').toUpperCase().slice(0,2)
      const hs = document.createElement('div')
      hs.dataset.groupId = g.id
      hs.style.cssText = `position:absolute;left:${x}%;top:${y}%;transform:translate(-50%,-50%);
        width:11%;aspect-ratio:1;border-radius:50%;
        background:conic-gradient(${col} ${deg}deg,${col}22 ${deg}deg);
        display:flex;align-items:center;justify-content:center`
      hs.innerHTML = `<div style="width:78%;height:78%;border-radius:50%;background:#0d1120;
        display:flex;align-items:center;justify-content:center;font-size:8px;color:${col};font-weight:700">${initials}</div>`
      container.appendChild(hs)
    }
  }
  renderSide(front, 'front'); renderSide(back, 'back')
  el._bmRenderSide = renderSide
  return el
}

function refreshBodyMapWidget(el) {
  if (!el._bmRenderSide) return
  el._bmRenderSide(el.children[0], 'front')
  el._bmRenderSide(el.children[1], 'back')
}

// ── Media player widget — reads straight from the source's stream endpoint,
// no local caching. Control lives on the device's own page; this widget only
// mirrors the broadcast playback state and reports position/ended back.
function mediaReportProgress(deviceId, position, duration) {
  fetch(`/api/devices/${deviceId}/media/control`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action:'progress', value:{ position, duration } })
  }).catch(()=>{})
}
function mediaSendControl(deviceId, action, value) {
  fetch(`/api/devices/${deviceId}/media/control`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action, value })
  }).catch(()=>{})
}

// ── Macro Player widget — renders the actual block graph from the Macro
// Editor (same layout, same colors), scaled-down and read-only. Greyed out
// while idle; while running, the active block gets highlighted with its
// live countdown/ramp progress, same data the editor's own monitor shows,
// and the view auto-scrolls to keep it in frame. No controls here; resuming
// a paused macro happens from the Macro Editor page, same as everywhere
// else in this app where the TV only displays state.
const MACRO_BLOCK_STYLES = {
  start:       { label:'START',        icon:'▶', bg:'#0e2614', bd:'#4ade80', tx:'#4ade80' },
  end:         { label:'END',          icon:'■', bg:'#260e0e', bd:'#f87171', tx:'#f87171' },
  stop_all:    { label:'STOP ALL',     icon:'⛔', bg:'#2a0808', bd:'#dc2626', tx:'#fca5a5' },
  delay:       { label:'DELAY',        icon:'⏱', bg:'#0d1a2e', bd:'#60a5fa', tx:'#93c5fd' },
  ramp:        { label:'COYOTE RAMP',  icon:'↗', bg:'#1c0e2e', bd:'#c084fc', tx:'#d8b4fe' },
  estim_ramp:  { label:'ESTIM RAMP',   icon:'↗', bg:'#221600', bd:'#f59e0b', tx:'#fcd34d' },
  nimble_start:{ label:'NIMBLE START', icon:'▶', bg:'#061a26', bd:'#4fc3f7', tx:'#7dd3fc' },
  nimble_stop: { label:'NIMBLE STOP',  icon:'⏹', bg:'#1a0606', bd:'#f87171', tx:'#fca5a5' },
  nimble_ramp: { label:'NIMBLE RAMP',  icon:'↗', bg:'#061a26', bd:'#4fc3f7', tx:'#7dd3fc' },
  hue_set:     { label:'SET HUE',      icon:'☀', bg:'#12101a', bd:'#a78bfa', tx:'#c4b5fd' },
  hue_ramp:    { label:'HUE RAMP',     icon:'↗', bg:'#12101a', bd:'#a78bfa', tx:'#c4b5fd' },
  io_set:      { label:'I/O SET',      icon:'⚡', bg:'#1a1400', bd:'#f0c040', tx:'#f0c040' },
  wait_eom:    { label:'WAIT: EOM',    icon:'◈', bg:'#261500', bd:'#f97316', tx:'#fdba74' },
  wait_manual: { label:'WAIT: MANUAL', icon:'⏸', bg:'#222000', bd:'#fbbf24', tx:'#fde68a' },
  wait_pawprints:{ label:'WAIT: PAW',  icon:'🐾', bg:'#001a2e', bd:'#4fc3f7', tx:'#7dd3fc' },
  if_pawprints:{ label:'PAW: IF/ELSE', icon:'🐾', bg:'#1a0e2e', bd:'#a78bfa', tx:'#c4b5fd' },
  if_else:     { label:'IF / ELSE',    icon:'⋈', bg:'#1e0628', bd:'#e879f9', tx:'#f0abfc' },
  run_macro:   { label:'RUN MACRO',    icon:'▷', bg:'#0a1a10', bd:'#34d399', tx:'#6ee7b7' },
  loop:        { label:'LOOP',         icon:'↺', bg:'#0c0c1a', bd:'#818cf8', tx:'#a5b4fc' },
  dev:         { label:'SET DEVICE',   icon:'⚡', bg:'#280d0d', bd:'#ef4444', tx:'#fca5a5' },
}
const MACRO_BLOCK_PORTS = {
  start:{i:[],o:['o']}, end:{i:['i'],o:[]}, if_else:{i:['i'],o:['oy','on']}, if_pawprints:{i:['i'],o:['oy','on']},
  loop:{i:['i'],o:['ob','od']}, dev:{i:['i'],o:['o']},
}
function macroBlockPorts(b)  { return MACRO_BLOCK_PORTS[b.type] || { i:['i'], o:['o'] } }
function macroBlockStyle(b)  { return MACRO_BLOCK_STYLES[b.type] || { label:(b.type||'').toUpperCase(), icon:'?', bg:'#111', bd:'#333', tx:'#ccc' } }
function macroBlockLabel(b) {
  if (b.type !== 'dev') return macroBlockStyle(b).label
  const dev = S.devices[b.devRef]
  return dev ? `SET ${dev.name.toUpperCase()}` : 'SET DEVICE'
}
function macroBlockSub(b) { return b.type === 'dev' && b.channel ? `Channel ${b.channel}` : '' }
function macroResolveWfName(id) {
  if (!id) return '—'
  const found = [...(S.waveforms.builtin||[]),...(S.waveforms.custom||[])].find(w=>w.id===id)
  return found ? found.name : id
}
function macroBlockSummary(b, cfg) {
  cfg = cfg || b.config || {}
  switch (b.type) {
    case 'delay':        return `${cfg.dur??10}s`
    case 'ramp':          return `${cfg.from??20}→${cfg.to??160} over ${cfg.dur||30}s${cfg.block?' ⏸':''}`
    case 'estim_ramp':    return `Ch ${cfg.channel||'Both'} ${cfg.from??0}→${cfg.to??80}% over ${cfg.dur||30}s${cfg.block?' ⏸':''}`
    case 'nimble_start':  return `Start ${cfg.speed||30} SPM / depth ${cfg.depth??500}`
    case 'nimble_stop':   return 'Stop stroke'
    case 'nimble_ramp':   return `${cfg.param||'Speed'} ${cfg.from??20}→${cfg.to??120} over ${cfg.dur||30}s${cfg.block?' ⏸':''}`
    case 'hue_set':        { const lbl = cfg.hueTargetName||cfg.hueTarget||'—'; return cfg.action==='off'?`${lbl} OFF`:`${lbl} · ${cfg.bri??80}%` }
    case 'io_set':          { const lbl = cfg.ioTargetName||cfg.ioTarget||'—'; return `${lbl} ${cfg.action==='off'?'OFF':'ON'}` }
    case 'hue_ramp':       return `${cfg.hueTargetName||''} ${cfg.from??20}%→${cfg.to??100}% over ${cfg.dur||30}s${cfg.block?' ⏸':''}`
    case 'wait_eom':       return `EOM ${(cfg.cond||'').includes('>')?'>':'<'} ${cfg.thr??70}%`
    case 'wait_manual':    return `"${cfg.prompt||'Continue when ready'}"`
    case 'wait_pawprints': return cfg.mode==='Tilt Angle'?`Tilt ±${cfg.sensitivity??15} on ${cfg.axis||'Any'}`:`Press ${cfg.button||'Any'} button`
    case 'if_pawprints':   return cfg.mode==='Tilt Angle'?`Tilt ±${cfg.sensitivity??15} on ${cfg.axis||'Any'}`:`${cfg.button||'Any'} pressed?`
    case 'if_else':        return `If EOM ${(cfg.cond||'').includes('>')?'>':'<'} ${cfg.thr??80}%`
    case 'loop':            return cfg.mode==='Repeat N times'?`×${cfg.count??3}`:`Until EOM ${(cfg.mode||'').includes('>')?'>':'<'} ${cfg.thr??75}%`
    case 'run_macro':       { const m = S.macros.find(x=>x.id===cfg.macroId); return m?`▷ ${m.name}`:'— select macro —' }
    case 'dev':              return cfg.waveform ? `${macroResolveWfName(cfg.waveform)} · ${cfg.intensity??cfg.powerA??''}` : (cfg.mode||'')
    default: return ''
  }
}
function macroPortPos(b, boxes, pt) {
  const box = boxes[b.id] || { w:170, h:60 }
  if (pt==='i')  return { x:b.x+box.w/2, y:b.y }
  if (pt==='o')  return { x:b.x+box.w/2, y:b.y+box.h }
  if (pt==='oy'||pt==='ob') return { x:b.x+box.w*.27, y:b.y+box.h }
  if (pt==='on'||pt==='od') return { x:b.x+box.w*.73, y:b.y+box.h }
  return { x:b.x, y:b.y }
}
function macroBezier(p1, p2) {
  const dy = p2.y-p1.y, cp = Math.max(40, Math.abs(dy)*.55)
  return `M ${p1.x} ${p1.y} C ${p1.x} ${p1.y+cp} ${p2.x} ${p2.y-cp} ${p2.x} ${p2.y}`
}
function macroPortColor(fp) {
  if (fp==='oy'||fp==='ob') return '#4ade80'
  if (fp==='on') return '#f87171'
  if (fp==='od') return '#94a3b8'
  return '#4a7fa8'
}

function updateMacroLiveStateClient(m) {
  const id = m.id; if (!id) return
  if (m.type === 'macro:running') S.macroLiveState[id] = { status:'running', name:m.name, blockId:null, blockType:null, config:null, countdown:null, ramp:null, waitPrompt:null, label:null }
  else if (m.type === 'macro:stopped') delete S.macroLiveState[id]
  else if (S.macroLiveState[id]) {
    const st = S.macroLiveState[id]
    if (m.type === 'macro:step') { st.status='running'; st.blockId=m.blockId; st.blockType=m.blockType; st.config=m.config; st.countdown=null; st.ramp=null; st.waitPrompt=null; st.label=null }
    else if (m.type === 'macro:countdown') st.countdown = { remaining:m.remaining, total:m.total }
    else if (m.type === 'macro:ramp') st.ramp = { value:m.value, from:m.from, to:m.to, elapsed:m.elapsed, total:m.total }
    else if (m.type === 'macro:wait') { st.status='waiting'; st.waitPrompt=m.prompt }
    else if (m.type === 'macro:label') st.label = { text:m.text, color:m.color }
  }
}

function buildMacroWidget(w) {
  const el = document.createElement('div')
  el.className = 'w'
  el.dataset.macroId = w.macroId

  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-shrink:0">
      <span class="w-title">${w.macroName || 'Macro'}</span>
      <span id="macro-status-${w.id}" style="font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:3px"></span>
    </div>
    <div id="macro-scroll-${w.id}" style="flex:1;min-height:0;overflow:auto;position:relative;border-radius:6px;background:#080b14">
      <div id="macro-canvas-${w.id}" style="position:relative;transition:filter .4s,opacity .4s">
        <svg id="macro-svg-${w.id}" style="position:absolute;top:0;left:0;pointer-events:none;overflow:visible"></svg>
      </div>
    </div>`

  let builtMacroId = null, lastActiveBlockId = null

  // Renders the static block graph once per macro (identical structure
  // every time — position/connections don't change while running), then
  // sync() only ever touches per-block highlight/progress on top of it.
  function buildGraph() {
    try { buildGraphInner() }
    catch (e) { console.error('[macro widget] buildGraph failed:', e.message); builtMacroId = null }
  }
  function buildGraphInner() {
    const macro = S.macros.find(m => m.id === w.macroId)
    // Scoped to `el`, not `document.getElementById` — this runs at widget
    // construction time, before renderHdmi() has appended `el` to the live
    // document, and getElementById only searches the attached tree. Every
    // lookup inside this widget needs to go through `el` for that reason.
    const canvas = el.querySelector(`#macro-canvas-${w.id}`)
    const svg = el.querySelector(`#macro-svg-${w.id}`)
    if (!canvas || !svg) return
    canvas.querySelectorAll('.mpw-blk').forEach(e => e.remove())
    builtMacroId = w.macroId
    if (!macro || !macro.blocks?.length) {
      canvas.style.width = '100%'; canvas.style.height = '100%'
      canvas.innerHTML = `<svg id="macro-svg-${w.id}" style="position:absolute;top:0;left:0"></svg><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#2a3555;gap:6px"><span style="font-size:22px;opacity:.4">▷</span><span style="font-size:11px">Macro not found</span></div>`
      return
    }
    const maxX = Math.max(...macro.blocks.map(b => (b.x||0) + (b.w||180))) + 20
    const maxY = Math.max(...macro.blocks.map(b => (b.y||0) + (b.h||70))) + 20
    canvas.style.width = maxX + 'px'; canvas.style.height = maxY + 'px'
    svg.setAttribute('width', maxX); svg.setAttribute('height', maxY)

    for (const b of macro.blocks) {
      const s = macroBlockStyle(b)
      const bel = document.createElement('div')
      bel.className = 'mpw-blk'
      bel.id = `mpwb-${w.id}-${b.id}`
      bel.style.cssText = `position:absolute;left:${b.x||0}px;top:${b.y||0}px;min-width:150px;max-width:190px;border-radius:7px;border:1.5px solid ${s.bd}55;background:${s.bg};box-shadow:0 3px 14px rgba(0,0,0,.5);transition:box-shadow .2s`
      const lbl = macroBlockLabel(b), sub = macroBlockSub(b), summary = macroBlockSummary(b)
      bel.innerHTML = `
        <div style="padding:6px 9px;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.3px;color:${s.tx}">
          <span style="font-size:11px;flex-shrink:0">${s.icon}</span>
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${lbl}${sub?`<br><span style="font-size:8px;opacity:.6;font-weight:400">${sub}</span>`:''}</span>
        </div>
        <div id="mpwbd-${w.id}-${b.id}" style="padding:2px 9px 7px;font-size:9px;color:rgba(255,255,255,.5);background:rgba(0,0,0,.35);border-radius:0 0 6px 6px;line-height:1.5;min-height:${summary?'auto':'0'}">${summary || ''}</div>`
      canvas.appendChild(bel)
    }

    // Measure real rendered sizes before drawing connectors, same two-pass
    // approach the full editor uses (sizes vary with label/summary length).
    requestAnimationFrame(() => {
      const boxes = {}
      for (const b of macro.blocks) {
        const bel = canvas.querySelector(`#mpwb-${w.id}-${b.id}`)
        if (bel) boxes[b.id] = { w: bel.offsetWidth, h: bel.offsetHeight }
      }
      svg.innerHTML = ''
      const blockMap = {}; for (const b of macro.blocks) blockMap[b.id] = b
      for (const c of macro.conns || []) {
        const fb = blockMap[c.fid], tb = blockMap[c.tid]
        if (!fb || !tb) continue
        const p1 = macroPortPos(fb, boxes, c.fp), p2 = macroPortPos(tb, boxes, 'i')
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        path.setAttribute('d', macroBezier(p1, p2))
        path.setAttribute('stroke', macroPortColor(c.fp))
        path.setAttribute('stroke-width', '2'); path.setAttribute('fill', 'none'); path.setAttribute('opacity', '.7')
        svg.appendChild(path)
      }
      // Blocks are laid out at whatever x/y they were dragged to in the
      // editor — rarely (0,0) — so the scroll view defaulting to (0,0)
      // often shows nothing but blank canvas at rest. Scroll to the START
      // block (every macro has exactly one) so something is visible
      // immediately instead of only once a running highlight scrolls to it.
      const scrollWrap = el.querySelector(`#macro-scroll-${w.id}`)
      const startBlock = macro.blocks.find(b => b.type === 'start') || macro.blocks[0]
      const startEl = startBlock && canvas.querySelector(`#mpwb-${w.id}-${startBlock.id}`)
      if (scrollWrap && startEl) startEl.scrollIntoView({ block: 'start', inline: 'start' })
    })
  }

  function sync() {
    const macro = S.macros.find(m => m.id === w.macroId)
    const canvasNow = el.querySelector(`#macro-canvas-${w.id}`)
    // Rebuild if the macro changed, OR if it was built empty (e.g. this
    // widget's very first sync landed before S.macros had arrived over the
    // WS 'state' message yet) but the data has since shown up — otherwise
    // the graph stays permanently blank until something else forces a
    // fresh widget instance (e.g. starting the macro elsewhere).
    const builtEmpty = builtMacroId === w.macroId && canvasNow && !canvasNow.querySelector('.mpw-blk') && macro?.blocks?.length
    if (w.macroId !== builtMacroId || builtEmpty) buildGraph()
    const st = S.macroLiveState[w.macroId]
    const statusEl = el.querySelector(`#macro-status-${w.id}`)
    const canvas = el.querySelector(`#macro-canvas-${w.id}`)
    const scrollWrap = el.querySelector(`#macro-scroll-${w.id}`)
    if (!statusEl || !canvas) return

    const running = !!st
    const waiting = running && st.status === 'waiting'
    // Opacity blends toward the (near-black) background, so combining it
    // with grayscale was fading the whole graph to almost nothing — the
    // blocks were genuinely there, just invisible. Grayscale + a milder
    // brightness dip reads as clearly "off" without losing visibility.
    canvas.style.filter = running ? 'none' : 'grayscale(1) brightness(.75)'
    canvas.style.opacity = '1'

    if (!running) {
      statusEl.textContent = 'IDLE'; statusEl.style.color = '#3a4a5a'; statusEl.style.background = '#0a0f1a'
    } else {
      statusEl.textContent = waiting ? 'WAITING' : 'RUNNING'
      statusEl.style.color = waiting ? '#fde68a' : '#4ade80'
      statusEl.style.background = waiting ? '#222000' : '#0e2614'
    }

    // Clear the previous active block's highlight/progress before applying
    // the new one — cheap enough to always touch on every sync, and avoids
    // tracking a second piece of "what was highlighted" state.
    if (lastActiveBlockId) {
      const prevEl = el.querySelector(`#mpwb-${w.id}-${lastActiveBlockId}`)
      if (prevEl) prevEl.style.boxShadow = '0 3px 14px rgba(0,0,0,.5)'
      const prevBody = el.querySelector(`#mpwbd-${w.id}-${lastActiveBlockId}`)
      const macro = S.macros.find(m => m.id === w.macroId)
      const prevBlock = macro?.blocks?.find(b => b.id === lastActiveBlockId)
      if (prevBody && prevBlock) prevBody.innerHTML = macroBlockSummary(prevBlock) || ''
      lastActiveBlockId = null
    }

    if (running && st.blockId) {
      const activeEl = el.querySelector(`#mpwb-${w.id}-${st.blockId}`)
      const bodyEl = el.querySelector(`#mpwbd-${w.id}-${st.blockId}`)
      if (activeEl) {
        activeEl.style.boxShadow = '0 0 0 2px #4ade80, 0 0 16px #4ade8088'
        lastActiveBlockId = st.blockId
        if (scrollWrap) activeEl.scrollIntoView({ block:'center', inline:'center', behavior:'smooth' })
      }
      if (bodyEl) {
        let progressHtml = ''
        if (st.countdown) {
          const pct = Math.max(0, Math.min(100, 100 - (st.countdown.remaining / (st.countdown.total||1)) * 100))
          progressHtml = `<div style="margin-top:4px;height:4px;background:#131925;border-radius:2px;overflow:hidden"><div style="width:${pct}%;height:100%;background:#93c5fd"></div></div><span style="font-size:8px;color:#5a6a8a">${st.countdown.remaining.toFixed(1)}s left</span>`
        } else if (st.ramp) {
          const pct = Math.max(0, Math.min(100, (st.ramp.elapsed / (st.ramp.total||1)) * 100))
          progressHtml = `<div style="margin-top:4px;height:4px;background:#131925;border-radius:2px;overflow:hidden"><div style="width:${pct}%;height:100%;background:#d8b4fe"></div></div><span style="font-size:8px;color:#5a6a8a">${st.ramp.value}</span>`
        } else if (waiting) {
          progressHtml = `<span style="color:#fde68a">${st.waitPrompt || 'Waiting…'}</span>`
        }
        if (st.label) progressHtml += `<div style="color:${st.label.color||'#8ab0d0'};margin-top:2px">${st.label.text}</div>`
        if (progressHtml) bodyEl.innerHTML = progressHtml
      }
    }
  }

  el._macroSync = sync
  sync()
  return el
}

function buildMediaWidget(w) {
  const el = document.createElement('div')
  el.className = 'w'
  el.style.cssText = 'padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:#000'
  el.dataset.widgetId = w.id
  el.dataset.mediaDevId = w.deviceId

  const label = document.createElement('div')
  label.style.cssText = 'position:absolute;top:8px;left:8px;font-size:10px;color:#8ab0d0;background:#00000090;padding:2px 8px;border-radius:4px;z-index:2;pointer-events:none;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap'
  label.textContent = 'No media'
  el.appendChild(label)

  let mediaEl = null, currentIdx = -1, imgTimer = null, progressTimer = null, stallTimer = null

  function stopTimers() {
    if (imgTimer) { clearTimeout(imgTimer); imgTimer = null }
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null }
    if (stallTimer) { clearTimeout(stallTimer); stallTimer = null }
  }

  function advanceOnEnd() {
    const pb = S.devices[w.deviceId]?.playback
    if (pb?.repeat === 'one') { if (mediaEl) { mediaEl.currentTime = 0; mediaEl.play().catch(()=>{}) } else loadItem(currentIdx, true) }
    else mediaSendControl(w.deviceId, 'next')
  }

  // Some files can't actually be decoded in-browser (unsupported codec/
  // container, corrupt stream) — they never error, they just sit there
  // showing nothing. If a file hasn't started producing frames a few
  // seconds after we told it to play, treat it as broken and skip it
  // rather than sitting on a black screen for the rest of the preview.
  function armStallWatchdog() {
    if (stallTimer) clearTimeout(stallTimer)
    stallTimer = setTimeout(() => {
      console.warn('[media] stalled, skipping:', mediaEl?.currentSrc)
      advanceOnEnd()
    }, 6000)
  }

  function loadItem(idx) {
    const dev = S.devices[w.deviceId]
    stopTimers()
    if (mediaEl) { mediaEl.remove(); mediaEl = null }
    const item = dev?.playlist?.[idx]
    currentIdx = idx
    if (!item) { label.textContent = 'No media'; return }
    label.textContent = item.name
    const src = `/api/media/stream/${w.deviceId}/${idx}`
    const pb = dev.playback || {}
    if (item.kind === 'video' || item.kind === 'audio') {
      mediaEl = document.createElement(item.kind==='video' ? 'video' : 'audio')
      mediaEl.src = src
      mediaEl.autoplay = pb.status === 'playing'
      mediaEl.style.cssText = item.kind==='video' ? 'width:100%;height:100%;object-fit:contain' : 'width:80%'
      mediaEl.volume = (pb.volume ?? 100) / 100
      mediaEl.addEventListener('ended', advanceOnEnd)
      mediaEl.addEventListener('loadedmetadata', () => { if (pb.position) mediaEl.currentTime = pb.position })
      mediaEl.addEventListener('error', () => { console.warn('[media] failed to load, skipping:', item.name); advanceOnEnd() })
      mediaEl.addEventListener('playing', () => { if (stallTimer) { clearTimeout(stallTimer); stallTimer = null } })
      el.appendChild(mediaEl)
      progressTimer = setInterval(() => {
        if (mediaEl && !mediaEl.paused) mediaReportProgress(w.deviceId, mediaEl.currentTime, mediaEl.duration||0)
      }, 3000)
      if (mediaEl.autoplay) armStallWatchdog()
    } else if (item.kind === 'image') {
      mediaEl = document.createElement('img')
      mediaEl.src = src
      mediaEl.style.cssText = 'width:100%;height:100%;object-fit:contain'
      el.appendChild(mediaEl)
      if (pb.status === 'playing') imgTimer = setTimeout(advanceOnEnd, 8000)
    }
  }

  function sync() {
    const dev = S.devices[w.deviceId]
    if (!dev) return
    const pb = dev.playback || {}
    if (pb.index !== currentIdx) { loadItem(pb.index); return }
    if (mediaEl && (mediaEl.tagName==='VIDEO' || mediaEl.tagName==='AUDIO')) {
      if (pb.status==='playing' && mediaEl.paused) { mediaEl.play().catch(()=>{}); armStallWatchdog() }
      if (pb.status!=='playing' && !mediaEl.paused) mediaEl.pause()
      mediaEl.volume = (pb.volume ?? 100) / 100
      // Only snap to a reported position on real drift — this widget is
      // itself the source of most position reports, so ignore its own echo.
      if (typeof pb.position === 'number' && Math.abs(mediaEl.currentTime - pb.position) > 1.5) mediaEl.currentTime = pb.position
    }
    if (mediaEl && mediaEl.tagName==='IMG') {
      if (pb.status==='playing' && !imgTimer) imgTimer = setTimeout(advanceOnEnd, 8000)
      if (pb.status!=='playing' && imgTimer) { clearTimeout(imgTimer); imgTimer=null }
    }
  }

  loadItem(S.devices[w.deviceId]?.playback?.index ?? -1)
  el._mediaSync = sync
  return el
}

function buildClockWidget(w) {
  const el = document.createElement('div')
  el.className = 'w w-center'
  const wrap = document.createElement('div')
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center'
  const timeEl = document.createElement('div')
  timeEl.style.cssText = 'color:#d0d8f0;font-weight:300;font-family:monospace;letter-spacing:.08em;white-space:nowrap'
  const dateEl = document.createElement('div')
  dateEl.style.cssText = 'color:#2e3e5e;white-space:nowrap;margin-top:4px'
  wrap.appendChild(timeEl); wrap.appendChild(dateEl)
  el.appendChild(wrap)

  function tick() {
    const now = new Date()
    timeEl.textContent = now.toLocaleTimeString('en-GB',{hour12:false})
    dateEl.textContent = now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})
  }
  tick(); setInterval(tick, 1000)

  // Fit both lines to the widget's box — same binary-search approach as the
  // text widget, keeping the date proportionally smaller than the time.
  function fit() {
    let lo = 8, hi = 200, best = lo
    while (lo <= hi) {
      const mid = (lo + hi) >> 1
      timeEl.style.fontSize = mid + 'px'
      dateEl.style.fontSize = Math.round(mid*0.28) + 'px'
      if (wrap.scrollWidth <= el.clientWidth && wrap.scrollHeight <= el.clientHeight) { best = mid; lo = mid + 1 }
      else hi = mid - 1
    }
    timeEl.style.fontSize = best + 'px'
    dateEl.style.fontSize = Math.round(best*0.28) + 'px'
  }
  new ResizeObserver(fit).observe(el)
  return el
}

// ── Live updates (no full re-render) ─────────────────────────────────────────

function updateLiveWidgets(devId) {
  const dev = hdmiDevice()
  const layout = activeLayout(dev)
  if (!layout) return
  for (const w of layout.widgets || []) {
    const el = document.querySelector(`[data-widget-id="${w.id}"]`)
    if (!el) continue
    if (w.type === 'channel' && w.deviceId === devId) refreshChannelWidget(el, w)
    if (w.type === 'group') {
      const grp = S.groups.find(g => g.id === w.groupId)
      if (grp?.channels?.some(c => c.deviceId === devId)) refreshGroupWidget(el, w)
    }
    if (w.type === 'bodymap') {
      const relevant = (S.groups||[]).some(g => g.bodyPos && g.channels?.some(c => c.deviceId === devId))
      if (relevant) refreshBodyMapWidget(el)
    }
  }
}

function refreshChannelWidget(el, w) {
  const dev = S.devices[w.deviceId]
  const ch  = dev?.channels?.[w.channel] || {}
  const active = (ch.intensity || 0) > 0
  el.classList.toggle('w-idle', !active)
  const badge = el.querySelector('.w-badge')
  if (badge) badge.textContent = resolveWfName(ch.waveform)
  const dcs = el.querySelectorAll('.dc')
  const vals = [Math.round(ch.intensity||0), Math.round(ch.baseFreq||0), Math.round((ch.intensity||0)/2)]
  dcs.forEach((c, i) => { c.dataset.v = vals[i]; drawDial(c) })
}

function refreshGroupWidget(el, w) {
  const grp = S.groups.find(g => g.id === w.groupId) || {}
  const ch = grpChannelState(grp)
  const active = grp.enabled !== false && (grp.channels||[]).length > 0 && (ch.intensity || 0) > 0
  el.classList.toggle('w-idle', !active)
  const dcs = el.querySelectorAll('.dc')
  const vals = [Math.round(ch.intensity||0), Math.round(ch.baseFreq||0)]
  dcs.forEach((c, i) => { if (vals[i] !== undefined) { c.dataset.v = vals[i]; drawDial(c) } })
}

// ── Live audio visualization ──────────────────────────────────────────────────

function _drawLiveViz(ctx, W, H, rawId, intensity, colorTop, colorBot) {
  const spec = _liveSpectra[rawId]
  const buf = spec?.levelBuf || []
  const mid = H / 2, scaleFactor = (intensity || 100) / 100
  const scale = v => Math.pow(Math.max(0, v * scaleFactor) / 100, 0.7) * (mid - 3)
  const n = Math.min(buf.length, W), step = W / Math.max(n, 1)
  const r = parseInt(colorTop.slice(1,3)||'a5', 16)
  const g = parseInt(colorTop.slice(3,5)||'f3', 16)
  const b = parseInt(colorTop.slice(5,7)||'fc', 16)
  const grd = ctx.createLinearGradient(0, 0, 0, H)
  grd.addColorStop(0,   `rgba(${r},${g},${b},0.15)`)
  grd.addColorStop(0.5, `rgba(${r},${g},${b},0.55)`)
  grd.addColorStop(1,   `rgba(${r},${g},${b},0.15)`)
  if (n > 1) {
    ctx.beginPath(); ctx.moveTo(0, mid)
    for (let i = 0; i < n; i++) ctx.lineTo(i * step, mid - scale(buf[buf.length - n + i]))
    for (let i = n-1; i >= 0; i--) ctx.lineTo(i * step, mid + scale(buf[buf.length - n + i]))
    ctx.closePath(); ctx.fillStyle = grd; ctx.fill()
    ctx.strokeStyle = `rgba(${r},${g},${b},0.9)`; ctx.lineWidth = 1.5
    ctx.beginPath()
    for (let i = 0; i < n; i++) ctx.lineTo(i * step, mid - scale(buf[buf.length - n + i]))
    ctx.stroke()
    ctx.beginPath()
    for (let i = 0; i < n; i++) ctx.lineTo(i * step, mid + scale(buf[buf.length - n + i]))
    ctx.stroke()
  }
  if (!buf.length) {
    ctx.fillStyle = '#444'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'
    ctx.fillText('Input not running', W/2, mid + 4); ctx.textAlign = 'left'
  }
  ctx.fillStyle = `rgba(${r},${g},${b},0.7)`; ctx.font = 'bold 9px monospace'
  ctx.fillText('LIVE', 4, 11)
}

// ── Waveform visualization (exact port of startChViz / startGrpViz from index.html) ──

function builtinFrameAmp(wfId, tick, speed=1) {
  const p = i => (tick*4 + i) * speed
  switch(wfId) {
    case 'pulse': { const ph=p(0)%40; const e=ph<8?(1-Math.cos(ph/8*Math.PI))/2:ph<24?1:ph<32?(1+Math.cos((ph-24)/8*Math.PI))/2:0; return Math.round(e*100) }
    case 'breathe': return Math.round(((Math.sin(p(0)*0.025)+1)/2)*100)
    case 'tidal': return Math.round((Math.abs(Math.sin(p(0)*0.0125))*0.9+0.05)*100)
    case 'wave': return Math.round(((Math.sin(p(0)*0.025)+1)/2)*100)
    case 'thud': { const ph=p(0)%40; const e=ph<12?(1-Math.cos(ph/12*Math.PI))/2:ph<20?1-(ph-12)/8:0; return Math.max(0,Math.round(e*100)) }
    case 'flutter': return p(0)%8<4?100:0
    case 'ramp': { const ph=p(0)%80; const e=ph<72?ph/72:(80-ph)/8*Math.cos((ph-72)/8*Math.PI*0.5); return Math.max(0,Math.round(e*100)) }
    case 'heartbeat': { const f=p(0)%32; return f===0?100:f===4?50:f===8?70:f===12?30:0 }
    case 'steps': return [25,50,75,100][Math.floor((p(0)%80)/20)]
    case 'buzz': return 100
    case 'ws-sawtooth':    { const ph=p(0)%40; return Math.round((ph/40)*100) }
    case 'ws-triangle':    { const ph=p(0)%40; return Math.round((ph<20?ph/20:(40-ph)/20)*100) }
    case 'ws-fangs':       { const ph=p(0)%40; const sp=n=>Math.max(0,1-Math.abs(ph-n)/6); return Math.round(Math.max(sp(8),sp(28))*100) }
    case 'ws-trapezoid':   { const ph=p(0)%40; return Math.round((ph<6?ph/6:ph<28?1:ph<34?(34-ph)/6:0)*100) }
    case 'ws-gentle':      { const ph=p(0)%80; return Math.round((ph<60?ph/60:(80-ph)/20)*100) }
    case 'ws-fast-attack': { const ph=p(0)%40; return Math.round(Math.exp(-ph*0.12)*100) }
    case 'ws-tapslide':    { const ph=p(0)%40; const tap=ph<5?(1-ph/5):0; const slide=ph>=10?(ph-10)/30:0; return Math.round(Math.max(tap,slide)*100) }
    case 'ws-jelly':       { const t2=p(0)*0.05; return Math.round(Math.max(0,(Math.sin(t2)*0.7+Math.sin(t2*0.3+1)*0.3+1)/2)*100) }
    case 'ws-double':      { const ph=p(0)%20; return Math.round(Math.max(0,Math.sin(ph/20*Math.PI))*100) }
    case 'ws-triple':      { const ph=p(0)%40; const sp=ph%(40/3); return Math.round(Math.max(0,Math.sin(sp/(40/3)*Math.PI))*100) }
    case 'ws-flourish':    { const ph=p(0)%40; const sm=ph<10?Math.sin(ph/10*Math.PI)*0.4:0; const bg=ph>=15&&ph<35?Math.sin((ph-15)/20*Math.PI):0; return Math.round(Math.max(sm,bg)*100) }
    case 'ws-rising':      { const ph=p(0)%80; const base=ph/80; const wave=(Math.sin(ph*0.25)+1)/2*0.4; return Math.round(Math.min(1,base+wave*base)*100) }
    default: return 0
  }
}

function startChWfViz(cv, devId, ch) {
  const state = { phase: 0 }
  const dpr = window.devicePixelRatio || 1
  let W = 0, H = 0
  const ctx = cv.getContext('2d')
  const colorTop = ch === 'A' ? '#a5f3fc' : '#fde68a'
  const colorBot = ch === 'A' ? 'rgba(79,195,247,.7)' : 'rgba(251,191,36,.7)'
  const actColorTop = '#fde68a', actColorBot = 'rgba(251,191,36,.7)'
  let lastPaint = 0, idlePainted = false

  function draw(ts) {
    if (!cv.isConnected) return
    // Layouts can have several of these waveform canvases running at once
    // (plus a video widget decoding/painting) — a scrolling waveform reads
    // just as smooth well under 60fps, so cap it to leave headroom for
    // everything else on screen.
    if (ts - lastPaint < 40) { requestAnimationFrame(draw); return }
    lastPaint = ts
    const cw = cv.clientWidth || cv.offsetWidth
    const ch2 = cv.clientHeight || cv.offsetHeight
    if (!cw || !ch2) { requestAnimationFrame(draw); return }
    if (cw !== W || ch2 !== H) {
      W = cw; H = ch2
      cv.width = W * dpr; cv.height = H * dpr
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      idlePainted = false
    }
    const dev = S.devices?.[devId]
    if (!dev || dev.status !== 'connected') {
      if (!idlePainted) {
        ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, W, H)
        ctx.fillStyle = '#1c1c1c'; ctx.fillRect(0, H-1, W, 1)
        idlePainted = true
      }
      requestAnimationFrame(draw); return
    }
    const chData = dev.channels?.[ch] || {}
    const intensity = Math.min(chData.intensity || 0, 100)
    const wfId = chData.waveform || 'pulse'
    const speed = chData.speed || 1
    const actMode = chData.mode === 'activity'
    const actDef = actMode ? (S.activities || []).find(a => a.id === chData.activityId) : null
    const vizWfId = actDef ? actDef.ampWave : wfId
    if (!actMode && vizWfId && vizWfId.startsWith('live-input:')) {
      idlePainted = false
      ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, W, H)
      _drawLiveViz(ctx, W, H, vizWfId.slice('live-input:'.length), intensity, colorTop, colorBot)
      requestAnimationFrame(draw); return
    }
    const wf = [...(S.waveforms?.builtin || []), ...(S.waveforms?.custom || [])].find(w => w.id === vizWfId)
      || (S.waveforms?.live || []).find(w => w.id === vizWfId)
    if (!wf) { requestAnimationFrame(draw); return }
    if (wf.type === 'audio') {
      idlePainted = false
      ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, W, H)
      const g2 = ctx.createLinearGradient(0, 0, 0, H)
      g2.addColorStop(0, actMode ? actColorTop : colorTop)
      g2.addColorStop(1, actMode ? actColorBot : colorBot)
      for (let px = 0; px < W; px++) {
        const t = px / W * Math.PI * 8 - ts * 0.003
        const amp = (Math.sin(t) * 0.5 + Math.sin(t * 1.7) * 0.3 + 0.8) / 1.6
        const bh = Math.max(1, Math.round(Math.min(1, amp) * intensity / 100 * (H - 2)))
        ctx.fillStyle = g2; ctx.fillRect(px, H - bh, 1, bh)
      }
      requestAnimationFrame(draw); return
    }
    // A zero-intensity channel paints the exact same flat line on every
    // frame — paint it once and leave the canvas alone until something
    // actually changes, instead of repainting a static image 25x/sec.
    if (intensity === 0) {
      if (!idlePainted) {
        const flatX = Math.floor(W * 0.3)
        ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, W, H)
        ctx.fillStyle = colorBot; ctx.fillRect(0, H - 1, W, 1)
        ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5
        ctx.beginPath(); ctx.moveTo(flatX, 0); ctx.lineTo(flatX, H); ctx.stroke()
        idlePainted = true
      }
      requestAnimationFrame(draw); return
    }
    idlePainted = false
    ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, W, H)
    const isBuiltin = !Array.isArray(wf.frames)
    const fLen = isBuiltin ? 480 : wf.frames.length
    const chTick = dev.ticks?.[ch] || 0
    if (dev.paused?.[ch]) state.phase = chTick
    else state.phase = dev.tickAt != null ? chTick + (ts - dev.tickAt) / 100 : state.phase + 1/60
    const PLAY_X = Math.floor(W * 0.3)
    const curFrame = Math.floor(state.phase)
    const g = ctx.createLinearGradient(0, 0, 0, H)
    g.addColorStop(0, actMode ? actColorTop : colorTop)
    g.addColorStop(1, actMode ? actColorBot : colorBot)
    for (let px = 0; px < W; px++) {
      const rawTick = curFrame + (px - PLAY_X)
      let amp
      if (isBuiltin) {
        amp = builtinFrameAmp(vizWfId, rawTick, speed)
      } else {
        const fi = ((Math.floor(rawTick * speed) % fLen) + fLen) % fLen
        const f = wf.frames[fi]
        amp = typeof f === 'number' ? f : (f?.segs?.[0]?.a ?? 0)
      }
      const bh = Math.max(1, Math.round(amp * intensity / 100 / 100 * (H - 2)))
      ctx.fillStyle = px < PLAY_X ? colorBot : g
      ctx.fillRect(px, H - bh, 1, bh)
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5
    ctx.beginPath(); ctx.moveTo(PLAY_X, 0); ctx.lineTo(PLAY_X, H); ctx.stroke()
    requestAnimationFrame(draw)
  }
  requestAnimationFrame(draw)
}

function startGrpWfViz(cv, groupId) {
  const state = { phase: 0 }
  const dpr = window.devicePixelRatio || 1
  let W = 0, H = 0
  const ctx = cv.getContext('2d')
  const colorTop = '#e9d5ff'
  const colorBot = 'rgba(167,139,250,.7)'
  let lastPaint = 0, idlePainted = false

  function draw(ts) {
    if (!cv.isConnected) return
    if (ts - lastPaint < 40) { requestAnimationFrame(draw); return }
    lastPaint = ts
    const cw = cv.clientWidth || cv.offsetWidth
    const ch = cv.clientHeight || cv.offsetHeight
    if (!cw || !ch) { requestAnimationFrame(draw); return }
    if (cw !== W || ch !== H) {
      W = cw; H = ch
      cv.width = W * dpr; cv.height = H * dpr
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      idlePainted = false
    }
    const grp = S.groups?.find(g => g.id === groupId)
    const firstCh = grp?.channels?.find(({ deviceId }) => S.devices?.[deviceId]?.status === 'connected')
    let intensity, wfId, speed, actMode = false, actDef = null
    if (firstCh) {
      const chData = S.devices[firstCh.deviceId]?.channels?.[firstCh.channel] || {}
      intensity = Math.min(chData.intensity || 0, 100)
      speed = chData.speed || 1
      actMode = chData.mode === 'activity'
      actDef = actMode ? (S.activities || []).find(a => a.id === chData.activityId) : null
      wfId = actDef ? actDef.ampWave : (chData.waveform || 'pulse')
    } else {
      intensity = 0; wfId = 'pulse'; speed = 1
    }
    const grpColorTop = actMode ? '#fde68a' : colorTop
    const grpColorBot = actMode ? 'rgba(251,191,36,.7)' : colorBot
    if (!actMode && wfId && wfId.startsWith('live-input:')) {
      idlePainted = false
      ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, W, H)
      _drawLiveViz(ctx, W, H, wfId.slice('live-input:'.length), intensity, grpColorTop, grpColorBot)
      requestAnimationFrame(draw); return
    }
    const wf = [...(S.waveforms?.builtin || []), ...(S.waveforms?.custom || [])].find(w => w.id === wfId)
      || (S.waveforms?.live || []).find(w => w.id === wfId)
    if (!wf) { requestAnimationFrame(draw); return }
    if (wf.type === 'audio') {
      idlePainted = false
      ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, W, H)
      const g2 = ctx.createLinearGradient(0, 0, 0, H)
      g2.addColorStop(0, grpColorTop); g2.addColorStop(1, grpColorBot)
      for (let px = 0; px < W; px++) {
        const t = px / W * Math.PI * 8 - ts * 0.003
        const amp = (Math.sin(t) * 0.5 + Math.sin(t * 1.7) * 0.3 + 0.8) / 1.6
        const bh = Math.max(1, Math.round(Math.min(1, amp) * intensity / 100 * (H - 2)))
        ctx.fillStyle = g2; ctx.fillRect(px, H - bh, 1, bh)
      }
      requestAnimationFrame(draw); return
    }
    // Same idle short-circuit as the channel version — a zero-intensity
    // (or no connected channel) group paints an identical flat line every
    // frame otherwise.
    if (intensity === 0) {
      if (!idlePainted) {
        const flatX = Math.floor(W * 0.3)
        ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, W, H)
        ctx.fillStyle = grpColorBot; ctx.fillRect(0, H - 1, W, 1)
        ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5
        ctx.beginPath(); ctx.moveTo(flatX, 0); ctx.lineTo(flatX, H); ctx.stroke()
        idlePainted = true
      }
      requestAnimationFrame(draw); return
    }
    idlePainted = false
    ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, W, H)
    const isBuiltin = !Array.isArray(wf.frames)
    const fLen = isBuiltin ? 480 : wf.frames.length
    const tickDev = firstCh ? S.devices[firstCh.deviceId] : null
    const grpChTick = tickDev?.ticks?.[firstCh?.channel] || 0
    if (tickDev?.paused?.[firstCh?.channel]) state.phase = grpChTick
    else state.phase = tickDev?.tickAt != null ? grpChTick + (ts - tickDev.tickAt) / 100 : state.phase + 1/60
    const PLAY_X = Math.floor(W * 0.3)
    const curFrame = Math.floor(state.phase)
    const g = ctx.createLinearGradient(0, 0, 0, H)
    g.addColorStop(0, grpColorTop); g.addColorStop(1, grpColorBot)
    for (let px = 0; px < W; px++) {
      const rawTick = curFrame + (px - PLAY_X)
      let amp
      if (isBuiltin) {
        amp = builtinFrameAmp(wfId, rawTick, speed)
      } else {
        const fi = ((Math.floor(rawTick * speed) % fLen) + fLen) % fLen
        const f = wf.frames[fi]
        amp = typeof f === 'number' ? f : (f?.segs?.[0]?.a ?? 0)
      }
      const bh = Math.max(1, Math.round(amp * intensity / 100 / 100 * (H - 2)))
      ctx.fillStyle = px < PLAY_X ? grpColorBot : g
      ctx.fillRect(px, H - bh, 1, bh)
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5
    ctx.beginPath(); ctx.moveTo(PLAY_X, 0); ctx.lineTo(PLAY_X, H); ctx.stroke()
    requestAnimationFrame(draw)
  }
  requestAnimationFrame(draw)
}

// ── Dial drawing ─────────────────────────────────────────────────────────────

function drawDial(canvas) {
  const v = +canvas.dataset.v, max = +canvas.dataset.max
  const color = canvas.dataset.color, label = canvas.dataset.label
  const sz = canvas.width, ctx = canvas.getContext('2d')
  const cx = sz/2, cy = sz/2, r = sz/2 - 5, lw = 5
  const start = Math.PI * 0.75, sweep = Math.PI * 1.5
  ctx.clearRect(0, 0, sz, sz)
  ctx.beginPath(); ctx.arc(cx, cy, r, start, start + sweep)
  ctx.strokeStyle = '#1a2235'; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke()
  if (v > 0) {
    ctx.beginPath(); ctx.arc(cx, cy, r, start, start + sweep * (v/max))
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke()
  }
  ctx.fillStyle = '#c8d4f0'; ctx.font = `500 ${Math.floor(r*0.46)}px monospace`
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(v, cx, cy - 1)
  ctx.fillStyle = '#3a4a6a'; ctx.font = `${Math.floor(r*0.28)}px sans-serif`
  ctx.fillText(label, cx, cy + r * 0.55)
}

// ── Camera streaming ─────────────────────────────────────────────────────────

function startCam(widgetId, streamKey) {
  const inner = document.getElementById('cam-inner-' + widgetId)
  if (!inner) return
  if (_cams[widgetId]?.streamKey === streamKey) return

  const vid = document.createElement('video')
  vid.autoplay = true; vid.muted = false; vid.playsInline = true
  vid.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:4px'

  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] })
  pc.addTransceiver('video', { direction: 'recvonly' })
  pc.addTransceiver('audio', { direction: 'recvonly' })
  pc.ontrack = e => { if (!vid.srcObject) { vid.srcObject = e.streams[0]; inner.innerHTML = ''; inner.appendChild(vid) } }

  _cams[widgetId] = { streamKey, pc, vid }

  pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => {
    return fetch(`/api/go2rtc/api/webrtc?src=${encodeURIComponent(streamKey)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp
    })
  }).then(r => r.text()).then(sdp => {
    pc.setRemoteDescription({ type: 'answer', sdp })
  }).catch(() => {
    // WebRTC failed — fall back to MSE over WebSocket
    inner.innerHTML = '<div class="w-cam-label">connecting (ws)…</div>'
    _mseFallback(widgetId, streamKey, inner)
  })
}

function _mseFallback(widgetId, streamKey, inner) {
  const vid = document.createElement('video')
  vid.autoplay = true; vid.muted = false; vid.playsInline = true
  vid.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:4px'
  const ms = new MediaSource()
  vid.src = URL.createObjectURL(ms)
  ms.addEventListener('sourceopen', () => {
    const sb = ms.addSourceBuffer('video/mp4; codecs="avc1.42E01E, mp4a.40.2"')
    const ws = new WebSocket(`${location.origin.replace(/^http/,'ws')}/api/go2rtc/api/ws?src=${encodeURIComponent(streamKey)}&media=video+audio`)
    ws.binaryType = 'arraybuffer'
    ws.onmessage = e => { if (sb && !sb.updating) try { sb.appendBuffer(e.data) } catch {} }
    ws.onopen = () => { inner.innerHTML = ''; inner.appendChild(vid) }
    if (_cams[widgetId]) _cams[widgetId].wsConn = ws
  })
}

// ── Helpers ──────────────────────────────────────────────────────────────────

function resolveWfName(wf) {
  if (!wf) return 'idle'
  for (const w of S.waveforms?.builtin || []) if (w.id === wf) return w.name
  for (const w of S.waveforms?.custom || []) if (w.id === wf) return w.name
  return wf
}

connect()
